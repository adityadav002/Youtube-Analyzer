services:
  # Backend Web Service
  - type: web
    name: youtube-analyzer-backend
    env: python
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: USE_CELERY
        value: "false"
      - key: CORS_ORIGINS
        sync: false # Prompt user to input frontend URL (e.g. https://youtube-analyzer-frontend.onrender.com)
      
      # Database connection (Option A: Render PostgreSQL)
      - key: DATABASE_URL
        fromDatabase:
          name: youtube-analyzer-db
          property: connectionString

      # Option B: External MySQL (Uncomment this and comment out Option A above)
      # - key: DATABASE_URL
      #   sync: false

  # Frontend Static Site
  - type: web
    name: youtube-analyzer-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Prompt user to input backend URL (e.g. https://youtube-analyzer-backend.onrender.com/api)

databases:
  - name: youtube-analyzer-db
    databaseName: youtube_analyzer
    user: db_user
    plan: free
