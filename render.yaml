services:
  # Backend Web Service
  - type: web
    name: youtube-analyzer-backend
    env: python
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: flask db upgrade && gunicorn --timeout 90 --workers 1 --threads 4 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: USE_CELERY
        value: "false"
      - key: ENABLE_DOWNLOADS
        value: "false"
      - key: ENABLE_LOCAL_FILE_OPEN
        value: "false"
      - key: RATELIMIT_STORAGE_URI
        value: memory://
      - key: SEARCH_CACHE_TTL_HOURS
        value: "24"
      - key: CORS_ORIGINS
        sync: false # Set to frontend URL e.g. https://youtube-analyzer-frontend.onrender.com
      - key: YOUTUBE_API_KEY
        sync: false # Required: Google Cloud Console YouTube Data API v3 key
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false # Optional: Google Gemini API key for AI summary & sentiment analysis
      
      # Database connection (Render PostgreSQL)
      - key: DATABASE_URL
        fromDatabase:
          name: youtube-analyzer-db
          property: connectionString

  # Frontend Static Site
  - type: web
    name: youtube-analyzer-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Set to backend URL e.g. https://youtube-analyzer-backend.onrender.com/api

databases:
  - name: youtube-analyzer-db
    databaseName: youtube_analyzer
    user: db_user
    plan: free
